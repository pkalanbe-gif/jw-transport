[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  CI = "false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pdfkit ships font files (.afm) that esbuild can't bundle correctly.
  # Marking it external means Netlify includes node_modules/pdfkit verbatim at runtime.
  external_node_modules = ["pdfkit"]

# Scheduled: invoices to clients, every Sunday at 00:00 Eastern Time.
# Cron is in UTC. 05:00 UTC Sunday = 00:00 EST (winter) / 01:00 EDT (summer).
[functions."weekly-invoices"]
  schedule = "0 5 * * 0"

# Scheduled: pay-stubs to employees, every Thursday at 16:00 Eastern Time.
# 21:00 UTC Thursday = 16:00 EST (winter) / 17:00 EDT (summer).
[functions."weekly-paystubs"]
  schedule = "0 21 * * 4"

# Scheduled: truck-rental (location) invoices to renters. Runs daily at
# 17:00 UTC (12:00 EST / 13:00 EDT); each contract is billed once per period
# (aux 2 semaines / hebdomadaire / mensuel) — sentAt guards duplicates.
[functions."biweekly-location-invoices"]
  schedule = "0 17 * * *"

[dev]
  command = "npm start"
  port = 3000
  publish = "build"
